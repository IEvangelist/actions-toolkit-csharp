name: "C# showcase 06: Rich job summaries"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-showcase
      - name: Measure repository source
        id: producer
        working-directory: .showcase
        run: dotnet run --file summary.cs -- measure
      - name: Verify the measurement and render a summary in C#
        working-directory: .showcase
        env:
          INPUT_FILES: ${{ steps.producer.outputs.files }}
        run: dotnet run --file summary.cs -- summarize
