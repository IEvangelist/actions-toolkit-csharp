name: build-and-test

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running a build?'
        required: true
        default: 'Manual build'
      verify_sdk:
        description: 'Run the C# SDK consumer and showcase workflows'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-test-projects:
    name: verify-test-projects
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          filter: tree:0

      - name: Verify all test projects are registered in ActionsToolkit.slnx
        shell: bash
        run: |
          set -euo pipefail

          # ActionsToolkit.slnx is the source of truth for the test
          # projects executed by `dotnet test`. Any test project on disk
          # under tests/ActionsToolkit.*.Tests/ that is not in the
          # solution would be silently skipped by CI, so fail fast here.
          # This covers both managed (*.Tests) and NativeAOT (*.Aot.Tests)
          # test projects, so adding a new package's test project does not
          # require editing this workflow -- only `dotnet sln add` is needed.

          missing=0
          found=0
          while IFS= read -r proj; do
            found=$((found + 1))
            name=$(basename "$proj")
            if ! grep -Fq "$name" ActionsToolkit.slnx; then
              echo "::error file=$proj::Test project '$name' is not registered in ActionsToolkit.slnx. Run: dotnet sln add \"$proj\""
              missing=$((missing + 1))
            fi
          done < <(find tests -type f -name 'ActionsToolkit.*.Tests.csproj' | sort)

          if [ "$found" -eq 0 ]; then
            echo "::error::No test projects found under tests/ActionsToolkit.*.Tests/. The discovery glob may be broken."
            exit 1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing test project(s) on disk are missing from ActionsToolkit.slnx. See tests/README.md for the convention."
            exit 1
          fi

          echo "All $found test project(s) under tests/ActionsToolkit.*.Tests/ are registered in ActionsToolkit.slnx."

  build:
    name: build-${{matrix.os}}
    needs: verify-test-projects
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: tree:0

      - name: 'Print manual build reason'
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo 'Reason: ${{ github.event.inputs.reason }}'

      - name: Build
        uses: ./.github/actions/build
        with:
          upload-artifacts: ${{ matrix.os == 'ubuntu-latest' }}

  test-samples:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Build
        run: |
          docker build -f samples/ActionsToolkit.Core.Sample/Dockerfile . -t actions-toolkit-sharp-core-sample:latest
          docker build -f samples/ActionsToolkit.Glob.Sample/Dockerfile . -t actions-toolkit-sharp-glob-sample:latest

      - uses: ./samples/ActionsToolkit.Core.Sample

      - uses: ./samples/ActionsToolkit.Glob.Sample
        with:
          files: "**/*.cs"

  sdk-consumers:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/sdk-consumers.yml

  showcase-01:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-01-inline-csharp.yml

  showcase-02:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-02-typed-inputs.yml

  showcase-03:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-03-step-outputs.yml

  showcase-04:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-04-environment-path.yml

  showcase-05:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-05-diagnostics.yml

  showcase-06:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-06-job-summary.yml

  showcase-07:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-07-process-execution.yml

  showcase-08:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-08-glob-filesystem.yml

  showcase-09:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-09-github-http.yml

  showcase-10:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-10-tool-cache.yml

  showcase-11:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-11-cache-artifacts.yml

  showcase-12:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/showcase-12-aot-attestation.yml

  showcase-13:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_sdk }}
    uses: ./.github/workflows/showcase-13-glob-file-stats.yml
